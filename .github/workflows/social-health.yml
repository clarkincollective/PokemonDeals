# SOCIAL-LIVE-2 - social publishing health check = the failure-alert route.
#
# Runs scripts/socialHealth.mjs twice a day. It is read-only against Buffer
# and records PUBLISHED / FAILED from provider evidence. Any condition that
# needs a human (tripped circuit, provider FAILED post, stuck submit, a post
# overdue for its slot) makes the job FAIL, and GitHub emails the repository
# owner about the failed scheduled run.
#
# Required repository secrets: NEXT_PUBLIC_SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY, BUFFER_ACCESS_TOKEN.

name: social health (failure alerts)

on:
  workflow_dispatch:
  schedule:
    # 08:30 and 20:30 Australia/Brisbane (UTC+10, no DST)
    - cron: "30 22,10 * * *"

concurrency:
  group: social-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Social health check (fails on anything needing a human)
        run: node scripts/socialHealth.mjs
