<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Space Grotesk', system-ui, sans-serif; }
    a { color: #EF4444; }
    a:hover { color: #F87171; }
  </style>
</helmet>

<div style="display:flex; flex-direction:column; gap:40px; padding:64px; background:#0A0A0A; width:1400px; box-sizing:border-box;">

  <div style="display:flex; align-items:center; gap:40px; padding:48px; background:radial-gradient(ellipse at 25% 30%, #171010 0%, #0A0A0A 65%); border-radius:20px;">

    <svg width="150" height="150" viewBox="0 0 150 150" style="flex-shrink:0;">
      <defs>
        <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="6" result="blur"></feGaussianBlur>
          <feMerge>
            <feMergeNode in="blur"></feMergeNode>
            <feMergeNode in="blur"></feMergeNode>
            <feMergeNode in="SourceGraphic"></feMergeNode>
          </feMerge>
        </filter>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FF6B5B"></stop>
          <stop offset="100%" stop-color="{{accent}}"></stop>
        </linearGradient>
      </defs>
      <g filter="url(#glow)">
        <circle cx="58" cy="58" r="40" fill="none" stroke="url(#glassGrad)" stroke-width="11"></circle>
        <path d="M38 40 A34 34 0 0 1 62 26" fill="none" stroke="#FF9A8D" stroke-width="4" stroke-linecap="round" opacity="0.65"></path>
        <line x1="87" y1="87" x2="128" y2="128" stroke="url(#glassGrad)" stroke-width="15" stroke-linecap="round"></line>
      </g>
    </svg>

    <div style="display:flex; flex-direction:column; gap:10px;">
      <div style="font-family:'Archivo Black', 'Space Grotesk', sans-serif; font-size:78px; letter-spacing:0.02em; line-height:1; background:linear-gradient(180deg, #FF6B5B 0%, {{accent}} 55%, #A81F12 100%); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow: 0 0 26px rgba(239,68,68,0.5);">
        POKÉMON
      </div>
      <div style="display:flex; align-items:center; gap:18px;">
        <span style="height:3px; width:64px; background:{{accent}}; border-radius:2px;"></span>
        <div style="font-family:'Archivo Black', 'Space Grotesk', sans-serif; font-size:38px; letter-spacing:0.06em; color:#FFFFFF;">
          DEAL FINDER
        </div>
        <span style="height:3px; width:64px; background:{{accent}}; border-radius:2px;"></span>
      </div>
    </div>
  </div>

  <div style="display:flex; align-items:center; justify-content:center; padding:32px; background:{{accent}}; border-radius:20px;">
    <div style="display:flex; align-items:center; gap:20px;">
      <svg width="52" height="52" viewBox="0 0 150 150">
        <circle cx="58" cy="58" r="40" fill="none" stroke="#FFFFFF" stroke-width="11"></circle>
        <line x1="87" y1="87" x2="128" y2="128" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"></line>
      </svg>
      <div style="font-family:'Archivo Black', 'Space Grotesk', sans-serif; font-size:34px; letter-spacing:0.03em; color:#FFFFFF;">
        DEAL FINDER
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#EF4444","options":["#EF4444","#DC2626","#E3350D","#F87171"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#EF4444' };
  }
}
</script>
</body>
</html>
